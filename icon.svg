<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="C-drive escape cleaner">
  <title>C 盘逃逸清理</title>
  <!-- A drive platter with an arrow escaping off it, plus a broom tick. -->
  <defs>
    <linearGradient id="platter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4252"/>
      <stop offset="1" stop-color="#2e3440"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fbcbb"/>
      <stop offset="1" stop-color="#88c0d0"/>
    </linearGradient>
  </defs>

  <!-- drive body -->
  <rect x="6" y="14" width="52" height="36" rx="6" fill="url(#platter)"/>
  <rect x="6" y="14" width="52" height="36" rx="6" fill="none" stroke="#4c566a" stroke-width="2"/>

  <!-- platter + spindle -->
  <circle cx="26" cy="32" r="11" fill="none" stroke="#4c566a" stroke-width="2"/>
  <circle cx="26" cy="32" r="3" fill="#4c566a"/>

  <!-- escape arrow: caches leaving the C: drive -->
  <path d="M39 38 L52 24" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M45 23 L53 23 L53 31" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- deletion tick -->
  <path d="M13 41 l4 4 l7 -8" stroke="#a3be8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
